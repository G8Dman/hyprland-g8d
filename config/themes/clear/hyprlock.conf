general {
    hide_cursor = true
}
background {
    monitor =
    color = rgba(eff4f8ff)
}
label {
    monitor =
    text = $TIME
    color = rgba(263544ff)
    font_size = 64
    font_family = DejaVu Sans
    position = 0, 100
    halign = center
    valign = center
}
label {
    monitor =
    text = g8d / clear
    color = rgba(8bbfbaff)
    font_size = 13
    font_family = DejaVu Sans
    position = 0, 20
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    outer_color = rgba(8bbfbaff)
    inner_color = rgba(ffffffff)
    font_color = rgba(263544ff)
    placeholder_text = Пароль
    fail_text = Неверный пароль
    capslock_color = rgba(e5b566ff)
    rounding = 6
    position = 0, -70
    halign = center
    valign = center
}

# Native layout follows the keyboard used to enter the password.
label {
    monitor =
    text = Раскладка: $LAYOUT[EN, RU]
    color = rgba(263544ff)
    font_size = 13
    font_family = DejaVu Sans
    position = 0, -125
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:250] python3 $HOME/.config/hyprland-g8d/plugins/lock-caps.py
    color = rgba(64778aff)
    font_size = 12
    font_family = DejaVu Sans
    position = 0, -155
    halign = center
    valign = center
}
